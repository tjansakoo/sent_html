<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฝากข้อความขึ้นจอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1530; --surface: #271f45; --line: #4a3f78;
    --text: #f4effc; --muted: #b3a9d1; --accent: #ff5c85; --ok: #4de1d2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(700px 500px at 10% 0%, #3a2468 0%, transparent 60%),
      radial-gradient(600px 500px at 100% 100%, #12394a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 20px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  textarea {
    width: 100%; min-height: 140px; resize: none; padding: 14px;
    background: var(--surface); color: var(--text);
    border: 2px solid var(--line); border-radius: 16px;
    font: inherit; font-size: 1.1rem;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin: 8px 2px 18px; }
  button {
    width: 100%; padding: 16px; border: 0; border-radius: 16px;
    background: var(--accent); color: #2a0a14; font: inherit; font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ok); outline-offset: 3px; }
  .status { min-height: 1.6em; margin-top: 16px; text-align: center; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--accent); }
  .note { margin-top: 28px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>ฝากข้อความขึ้นจอ</h1>
  <p class="sub">พิมพ์อะไรก็ได้ ข้อความของคุณจะลอยผ่านหน้าจอที่งาน</p>

  <label for="msg" class="sr" style="position:absolute;left:-9999px">ข้อความ</label>
  <textarea id="msg" maxlength="80" placeholder="เช่น สนใจเรียนที่นี่!"></textarea>
  <div class="meta"><span>ไม่เกิน 80 ตัวอักษร</span><span id="count">0 / 80</span></div>

  <button id="send" type="button">ส่งขึ้นจอ</button>
  <div class="status" id="status" role="status"></div>

  <p class="note">ข้อความจะแสดงบนจอสาธารณะ โปรดใช้ถ้อยคำสุภาพ</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var topic = new URLSearchParams(location.search).get("t") || "";
  var msg = $("msg"), btn = $("send"), st = $("status");
  var COOLDOWN = 10; // วินาที ระหว่างการส่งแต่ละครั้งในเครื่องเดียวกัน
  var KEY = "sendMsgLast";

  function setStatus(t, cls) { st.textContent = t; st.className = "status " + (cls || ""); }

  if (!/^[A-Za-z0-9_-]{4,64}$/.test(topic)) {
    btn.disabled = true; msg.disabled = true;
    setStatus("ลิงก์นี้ไม่ถูกต้อง ลองสแกน QR จากหน้าจออีกครั้ง", "err");
    return;
  }

  msg.addEventListener("input", function () { $("count").textContent = msg.value.length + " / 80"; });

  function wait() {
    var last = 0;
    try { last = +localStorage.getItem(KEY) || 0; } catch (e) {}
    return Math.max(0, Math.ceil(COOLDOWN - (Date.now() - last) / 1000));
  }

  btn.addEventListener("click", function () {
    var text = msg.value.replace(/\s+/g, " ").trim();
    if (!text) { setStatus("พิมพ์ข้อความก่อนนะ", "err"); return; }
    var w = wait();
    if (w > 0) { setStatus("รออีก " + w + " วินาทีแล้วส่งใหม่ได้", "err"); return; }

    btn.disabled = true; setStatus("กำลังส่ง…");
    fetch("https://ntfy.sh/" + encodeURIComponent(topic), {
      method: "POST",
      body: text.slice(0, 80)
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      msg.value = ""; $("count").textContent = "0 / 80";
      setStatus("ส่งแล้ว! ดูข้อความของคุณบนจอได้เลย", "ok");
    }).catch(function () {
      setStatus("ส่งไม่สำเร็จ ลองใหม่อีกครั้ง", "err");
    }).then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
